apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: gobank-monitoring
---
# Prometheus only needs to discover Pods in the banking namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: gobank
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: gobank
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: gobank-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
