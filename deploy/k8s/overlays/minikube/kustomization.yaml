apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gobank
resources:
  - ../../base
  - ../../data
# Version tags match the published images; no hard-coded pod names are needed.
images:
  - name: docker.io/azare242/gobank-gateway
    newTag: v2
  - name: docker.io/azare242/gobank-shard
    newTag: v2
