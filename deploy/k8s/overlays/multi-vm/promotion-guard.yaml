apiVersion: v1
kind: ConfigMap
metadata:
  name: gobank-fenced-primaries
  namespace: gobank
data: {}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: gobank-fence-before-promotion
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [postgresql.cnpg.io]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [clusters/status]
  variables:
    - name: previous
      expression: "has(oldObject.status) && has(oldObject.status.targetPrimary) ? oldObject.status.targetPrimary : ''"
    - name: next
      expression: "has(object.status) && has(object.status.targetPrimary) ? object.status.targetPrimary : ''"
  validations:
    - expression: >-
        variables.previous == variables.next ||
        (variables.previous == '' && variables.next != '') ||
        (variables.previous == 'pending' && variables.next != '') ||
        (variables.next != '' && has(params.data) &&
        object.metadata.name in params.data &&
        params.data[object.metadata.name] == variables.previous)
      message: Verify the former primary is fenced before changing the PostgreSQL target primary.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: gobank-fence-before-promotion
spec:
  policyName: gobank-fence-before-promotion
  validationActions: [Deny]
  paramRef:
    namespace: gobank
    name: gobank-fenced-primaries
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: gobank
