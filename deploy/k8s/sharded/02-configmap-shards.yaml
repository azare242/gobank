# The gateway reads this file to find the replicas of each shard.
# Each replica is a Kubernetes Service inside the gobank namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gobank-shardmap
  namespace: gobank
data:
  shards.json: |
    {
      "shards": [
        {
          "id": "a",
          "first": 1,
          "last": 1000,
          "replicas": [
            "http://shard-a1:3000",
            "http://shard-a2:3000"
          ]
        },
        {
          "id": "b",
          "first": 1001,
          "last": 2000,
          "replicas": [
            "http://shard-b1:3000",
            "http://shard-b2:3000"
          ]
        }
      ]
    }
