apiVersion: apps/v1
kind: Deployment
metadata:
  name: shard-a
spec:
  replicas: 2
  minReadySeconds: 5
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shard-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shard-a
        app.kubernetes.io/part-of: gobank
        app.kubernetes.io/component: shard
        gobank/shard: a
    spec:
      serviceAccountName: gobank-app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shard
          image: docker.io/azare242/gobank-shard:v2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: gobank-config
          env:
            - name: REPLICA_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gobank-app-secrets
                  key: INTERNAL_TOKEN
            - name: SHARD_ID
              value: a
            - name: DB_DSN
              valueFrom:
                secretKeyRef:
                  name: gobank-app-secrets
                  key: SHARD_A_DSN
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            # Three minutes allows the two-minute DB startup budget to finish.
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: [sleep, "5"]
          volumeMounts:
            - name: shardmap
              mountPath: /app/shards.json
              subPath: shards.json
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: shardmap
          configMap:
            name: gobank-shardmap
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
