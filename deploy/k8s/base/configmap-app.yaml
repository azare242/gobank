apiVersion: v1
kind: ConfigMap
metadata:
  name: gobank-config
data:
  LISTEN_ADDR: ":3000"
  SHARD_MAP: /app/shards.json
  JWT_ISSUER: gobank-assignment3
  JWT_AUDIENCE: gobank-client
  SEED_FIXTURES: "true"
  METRICS_ADDR: ":9090"
  STARTUP_TIMEOUT: 2m
  STARTUP_ATTEMPT_TIMEOUT: 10s
  SHUTDOWN_TIMEOUT: 25s
  HTTP_READ_TIMEOUT: 10s
  HTTP_WRITE_TIMEOUT: 60s
  READINESS_TIMEOUT: 1s
  SHARD_HTTP_TIMEOUT: 6s
  COORDINATOR_TIMEOUT: 30s
  DISCOVERY_REFRESH_INTERVAL: 2s
  DB_MAX_OPEN_CONNS: "15"
  DB_MAX_IDLE_CONNS: "5"
  DB_CONN_MAX_LIFETIME: 5m
  DB_CONN_MAX_IDLE_TIME: 1m
