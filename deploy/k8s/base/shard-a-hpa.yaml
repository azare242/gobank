apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shard-a
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shard-a
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
