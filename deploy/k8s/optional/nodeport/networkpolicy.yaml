# Optional: opening NodePort also allows external IPv4 traffic to HTTP only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-nodeport
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 3000
