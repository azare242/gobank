apiVersion: v1
kind: Service
metadata:
  name: gateway-nodeport
spec:
  type: NodePort
  # Preserve the external source address for the fallback ingress policy.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
