# Three Raft voters. Each node has its own Deployment and its own PVC.
# They use the same image as the standalone server, but run cluster-server.
#
# At start-up a node resolves its own headless Service name to a Pod IP and
# binds Raft to it. If DNS is not published yet, the process exits and Kubernetes
# restarts it, so a few restarts on a brand-new cluster are normal.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cluster-a-data
  namespace: gobank-cluster
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-a
  namespace: gobank-cluster
  labels:
    app: cluster-a
    component: gobank-cluster
spec:
  replicas: 1
  # The Raft data volume is ReadWriteOnce, so never run two Pods on it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cluster-a
  template:
    metadata:
      labels:
        app: cluster-a
        component: gobank-cluster
    spec:
      initContainers:
        # The image runs as UID 10001, but a new volume is owned by root.
        - name: fix-data-permissions
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "chown -R 10001:10001 /app/data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: node
          image: gobank:latest
          imagePullPolicy: IfNotPresent
          command: ["cluster-server"]
          args: ["-config", "/app/config/a.json"]
          ports:
            - name: http
              containerPort: 3000
            - name: raft
              containerPort: 7000
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gobank-cluster-secrets
                  key: JWT_SECRET
            - name: JWT_ISSUER
              valueFrom:
                secretKeyRef:
                  name: gobank-cluster-secrets
                  key: JWT_ISSUER
            - name: JWT_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: gobank-cluster-secrets
                  key: JWT_AUDIENCE
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: config
              mountPath: /app/config
              readOnly: true
          # /health only checks that the process is alive.
          # /ready writes a Raft barrier, so it is not used as a periodic probe.
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cluster-a-data
        - name: config
          configMap:
            name: gobank-cluster-config
---
